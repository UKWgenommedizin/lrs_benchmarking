# =============================================================================
# COMMON ASSEMBLER WORKFLOW CONFIGURATION
# =============================================================================
# Settings shared by local testing and server execution.
#
# Machine-specific directories do NOT belong here.
# See:
#   config/local.yaml
#   config/server.yaml
#
# The assembler workflow starts directly from final normalized
# chromosome-21 FASTQ files.
# =============================================================================

sample_sheet: "samples.tsv"


# -----------------------------------------------------------------------------
# Biological target
# -----------------------------------------------------------------------------


chromosome: "chr21"
genome_size: 46709983
min_mapq: 20
target_coverage: 30
target_bases: 1401299490


# -----------------------------------------------------------------------------
# Assemblers
# -----------------------------------------------------------------------------

active_assemblers:
  - flye
  - goldrush
  - ntlink
  - verkko


# -----------------------------------------------------------------------------
# Output locations
# -----------------------------------------------------------------------------
#
# input_root in config/local.yaml or config/server.yaml.
# -----------------------------------------------------------------------------

output_root: "results"


# -----------------------------------------------------------------------------
# Input dataset contract
# -----------------------------------------------------------------------------
#
# samples.tsv contains sample metadata only:
#
# sample    technology
#
# Example:
#
# HG002     ont
# HG002     pb
# HG003     ont
# HG003     pb
#
# samples.tsv deliberately contains NO machine-specific file paths.
#
# The location of the dataset is provided through:
#
#   config/local.yaml  -> local input_root
#   config/server.yaml -> server input_root
#
# Under input_root, the workflow expects one directory per sample:
#
# input_root/
# ├── HG002/
# ├── HG003/
# └── HG004/
#
# Expected FASTQ naming convention:
#
# HG002/HG002.ont.chr21.primary.mapq20.30x.fastq.gz
# HG002/HG002.hifi.chr21.primary.mapq20.30x.fastq.gz
#
# Technology naming used by the workflow:
#
#   ont -> ont
#   pb  -> hifi
#
# The exact FASTQ path is constructed automatically in rules/common.smk
# from:
#
#   input_root + sample + technology
#
# No whole-genome input or chromosome-extraction step is required by the
# assembler workflow.
# -----------------------------------------------------------------------------


# -----------------------------------------------------------------------------
# Default runtime settings
# -----------------------------------------------------------------------------
#
# Machine-specific resource values can override this default in:
#
#   config/local.yaml
#   config/server.yaml
# -----------------------------------------------------------------------------

threads: 4


# -----------------------------------------------------------------------------
# Progress and logging
# -----------------------------------------------------------------------------
#
# Rules write execution state markers under results/progress and detailed
# application logs under results/logs.
# -----------------------------------------------------------------------------

progress_dir: "results/progress"
log_dir: "results/logs"


# -----------------------------------------------------------------------------
# Assembler containers
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------

containers:
  flye2: "nicolasardila1/lrs-flye2:2.9.6"
  goldrush: "nicolasardila1/lrs-goldrush:1.2.2"
  ntlink: "nicolasardila1/lrs-ntlink:1.3.11"
  verkko2: "nicolasardila1/lrs-verkko2:2.3.2"